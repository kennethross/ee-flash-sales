name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inventory-reservation .
      - name: Start the container and probe it
        run: |
          docker run -d --rm -p 3000:3000 --name inventory inventory-reservation
          for i in $(seq 1 20); do
            curl -sf localhost:3000/api/health && break
            sleep 1
          done
          curl -sf localhost:3000/api/health
          curl -sf localhost:3000/ | grep -q 'Flash Sale Simulator'
          docker stop inventory
