services:
  inventory:
    build: .
    image: inventory-reservation
    # HOST_PORT=8080 docker compose up  → http://localhost:8080
    ports:
      - '${HOST_PORT:-3000}:3000'
    environment:
      PORT: '3000'
    # State lives in this one process: never scale this service beyond one replica (see README).
    deploy:
      replicas: 1
    # Health check comes from the image (Dockerfile HEALTHCHECK).
