services:
  inventory:
    build: .
    image: inventory-reservation
    # HOST_PORT=8080 docker compose up  → http://localhost:8080
    ports:
      - '${HOST_PORT:-3000}:3000'
    environment:
      PORT: '3000'
    # State lives in this one process: never scale this service beyond one replica (see README).
    deploy:
      replicas: 1
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
